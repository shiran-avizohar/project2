<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Bitcoin</title>
</head>
<body> 
    <div id="menu">   
        <button id='buttonSearch'>Search</button>
        <input id='searchInput' placeholder="Search..." required>
    </div>

    <h1 class="title">Virtual trading information</h1>

    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link active" id="navCoins" href="#coins" data-bs-toggle="tab">Coins</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="navReports" href="#reports" data-bs-toggle="tab">Reports</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="navAbout" href="#about" data-bs-toggle="tab">About</a>
        </li>
    </ul>

    <main id="main">
        <section id="coins">
            <h2>Bitcoin Info</h2>
            <div id="bitcoinInfo">
                <!-- המידע יתווסף כאן -->
            </div>

            <button id="buttonMoreInfo" data-bs-toggle="modal" data-bs-target="#moreInfoModal">More Info</button>

            <div class="modal fade" id="moreInfoModal" tabindex="-1" aria-labelledby="moreInfoModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="moreInfoModalLabel">Bitcoin Info</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <h2 class="fs-5">Prices</h2>
                            <ul>
                                <li>USD: <span id="usdPrice"></span></li>
                                <li>EUR: <span id="eurPrice"></span></li>
                                <li>ILS: <span id="ilsPrice"></span></li>
                            </ul>
                            <hr>
                            <h2 class="fs-5">Image</h2>
                            <img id="bitcoinImage" class="img-fluid" alt="Bitcoin">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="tab-pane fade" id="reports" role="tabpanel">
            this is reports page
        </section>

        <section class="tab-pane fade" id="about" role="tabpanel">
            <h1>my name is Ido</h1>
        </section>
    </main>

    <div id="cards-container"></div>

</body>
</html>
